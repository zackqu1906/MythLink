[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mythlink"
version = "0.6.30"
description = "An integrated smart ring platform for voice input, mouse control, gesture recognition, and contextual interactions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<2",
  "torch>=2.11,<2.12",
]

[project.optional-dependencies]
touchpad = ["onnxruntime==1.21.0; platform_system == 'Darwin' and platform_machine == 'arm64'", "onnxruntime==1.21.0; platform_system == 'Windows' and platform_machine == 'AMD64'", "MNN==3.6.1; platform_system == 'Darwin' or platform_system == 'Windows'", "pyobjc-framework-Quartz>=12.2.2; platform_system == 'Darwin'", "pyobjc-framework-ApplicationServices>=12.2.2; platform_system == 'Darwin'"]
ring = ["smpclient==5.2.0; platform_system == 'Darwin' or platform_system == 'Windows'", "smpclient[ble]==7.0.0; platform_system != 'Darwin' and platform_system != 'Windows'", "bleak==1.1.1; platform_system == 'Windows' or platform_system == 'Darwin'", "bleak>=3.0.1; platform_system != 'Windows' and platform_system != 'Darwin'", "cryptography>=45.0.0"]
ring-opus = ["smpclient==5.2.0; platform_system == 'Darwin' or platform_system == 'Windows'", "smpclient[ble]==7.0.0; platform_system != 'Darwin' and platform_system != 'Windows'", "bleak==1.1.1; platform_system == 'Windows' or platform_system == 'Darwin'", "bleak>=3.0.1; platform_system != 'Windows' and platform_system != 'Darwin'", "cryptography>=45.0.0", "opuslib>=3.0.1"]
mic = ["sounddevice>=0.5.3"]
asr = ["funasr>=1.3.26", "modelscope-hub>=0.3,<1", "huggingface_hub", "numpy<=1.26.4"]
asr-sensevoice = ["funasr>=1.3.26", "modelscope-hub>=0.3,<1", "huggingface_hub", "numpy<=1.26.4"]
asr-streaming-sensevoice = ["funasr>=1.3.26", "modelscope-hub>=0.3,<1", "huggingface_hub", "asr-decoder", "online-fbank", "torchaudio>=2.11,<2.12", "numpy<=1.26.4"]
asr-funasr-nano = ["torch>=2.11,<2.12", "funasr>=1.3.26", "transformers>=4.51.3", "torchaudio>=2.11,<2.12", "numpy<=1.26.4"]
asr-whisper = ["faster-whisper>=1.1.0"]
asr-http = ["requests>=2.31"]
asr-volcengine = ["websocket-client>=1.8"]
ui = ["PySide6==6.9.3; platform_system == 'Darwin'", "PySide6>=6.9,<7; platform_system != 'Darwin'", "sounddevice>=0.5.3", "comtypes>=1.4,<2; platform_system == 'Windows'", "pyobjc-framework-Quartz>=12.2.2; platform_system == 'Darwin'", "pyobjc-framework-ApplicationServices>=12.2.2; platform_system == 'Darwin'", "pyobjc-framework-ScreenCaptureKit>=12.2.2,<13; platform_system == 'Darwin'", "pyobjc-framework-Vision>=12.2.2,<13; platform_system == 'Darwin'"]
dev = ["pytest>=8.0", "pytest-xdist>=3.6", "pytest-timeout>=2.3"]
all = ["smpclient==5.2.0; platform_system == 'Darwin' or platform_system == 'Windows'", "smpclient[ble]==7.0.0; platform_system != 'Darwin' and platform_system != 'Windows'", "onnxruntime==1.21.0; platform_system == 'Darwin' and platform_machine == 'arm64'", "onnxruntime==1.21.0; platform_system == 'Windows' and platform_machine == 'AMD64'", "MNN==3.6.1; platform_system == 'Darwin' or platform_system == 'Windows'", "bleak==1.1.1; platform_system == 'Windows' or platform_system == 'Darwin'", "bleak>=3.0.1; platform_system != 'Windows' and platform_system != 'Darwin'", "cryptography>=45.0.0", "sounddevice>=0.5.3", "funasr>=1.3.26", "modelscope-hub>=0.3,<1", "huggingface_hub", "asr-decoder", "online-fbank", "transformers>=4.51.3", "torchaudio>=2.11,<2.12", "numpy<=1.26.4", "faster-whisper>=1.1.0", "requests>=2.31", "websocket-client>=1.8", "PySide6==6.9.3; platform_system == 'Darwin'", "PySide6>=6.9,<7; platform_system != 'Darwin'", "comtypes>=1.4,<2; platform_system == 'Windows'", "pyobjc-framework-Quartz>=12.2.2; platform_system == 'Darwin'", "pyobjc-framework-ApplicationServices>=12.2.2; platform_system == 'Darwin'", "pyobjc-framework-ScreenCaptureKit>=12.2.2,<13; platform_system == 'Darwin'", "pyobjc-framework-Vision>=12.2.2,<13; platform_system == 'Darwin'", "pytest>=8.0"]

[project.scripts]
mythlink = "proximic_ring.cli:main"
mythlink-ui = "proximic_ring.ui.main:main"
# Preserve existing automation and development commands.
proximic-ring = "proximic_ring.cli:main"
proximic-ring-ui = "proximic_ring.ui.main:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ring_python_sdk = ["touchpad/assets/*"]
ring_mac_sdk = ["py.typed", "assets/*", "native/*.dylib", "licenses/*", "web/*"]
ring_windows_sdk = ["py.typed", "assets/*", "native/*.dll", "licenses/*", "web/*"]
proximic_ring = ["assets/firmware/*.zip", "assets/firmware/*.json", "agent_workflow/agent/desktop_owner/*", "browser_bridge/*.json", "browser_bridge/extension/*", "assets/*.model", "assets/*.json", "assets/*.npy", "assets/*.gz", "ui/qml/*.qml", "ui/qml/*.js", "agent_workflow/operations/*.json", "agent_workflow/ui/qml/*.qml", "agent_workflow/ui/rich_text/*", "agent_workflow/ui/rich_text/vendor/*", "agent_workflow/ui/rich_text/vendor/fonts/*", "ui/assets/*.svg", "ui/assets/*.png", "ui/assets/figma/*.svg", "ui/assets/figma/*.png", "ui/assets/figma/history/*.svg", "ui/assets/fonts/*.otf", "ui/assets/fonts/*.txt", "assets/unicode-license.txt", "assets/stroke-left-dots-*.txt", "assets/stroke-glyphs-*.txt"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# A hung Qt event loop or socket fails one test instead of stalling the run.
timeout = 180
markers = [
    "mac_only: needs macOS frameworks or paths; skipped elsewhere",
    "posix_only: needs POSIX APIs; skipped on Windows",
]
