<!doctype html><meta charset="utf-8"><title>Ring 本地编辑诊断（无网络）</title><h1>Ring 本地编辑诊断</h1><label>单行<input id="single" value="原文内容删除全部内容。"></label><br><label>多行<textarea id="multi">原文内容删除全部内容。</textarea></label><pre id="status">等待操作</pre><script>for(const e of document.querySelectorAll('input,textarea')) {for (const t of ['keyup','select','click','input']) e.addEventListener(t,ev=>{document.getElementById('status').textContent=e.id+' '+ev.type+' '+ev.key+' selection='+e.selectionStart+','+e.selectionEnd;});}</script>
